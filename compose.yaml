services:
  postgres:
    image: 'postgres:16-alpine'
    container_name: db_workhub
    environment:
      - 'POSTGRES_DB=${DB:-workhub-db}'
      - 'POSTGRES_PASSWORD=${PASSWORD_DB:-workhub}'
      - 'POSTGRES_USER=${USER_DB:-workhub}'
    ports:
      - '5432:5432'

  keycloak-postgres:
    image: 'postgres:16-alpine'
    container_name: db_keycloak
    labels:
      org.springframework.boot.ignore: true
    environment:
      - 'POSTGRES_DB=${KEYCLOAK_DB:-keycloak-db}'
      - 'POSTGRES_PASSWORD=${KEYCLOAK_PASSWORD_DB:-keycloak}'
      - 'POSTGRES_USER=${KEYCLOAK_USER_DB:-keycloak}'

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: keycloak-auth
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB:-keycloak-db}
      KC_DB_USERNAME: ${KEYCLOAK_USER_DB:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_PASSWORD_DB:-keycloak}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/workhub-realm.json:/opt/keycloak/data/import/workhub-realm.json:ro
    depends_on:
      - keycloak-postgres
