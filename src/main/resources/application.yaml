spring:
  application:
    name: workhub
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB:workhub-db}
    username: ${USER_DB:workhub}
    password: ${PASSWORD_DB:workhub}
auth:
  jwt:
    secret: ${JWT_SECRET:workhub-local-development-secret-change-me-please}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
server:
  port: 9001